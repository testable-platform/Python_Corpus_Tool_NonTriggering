# uv 0.12.9 configuration for branch PY-046.
#
# This one WORKS. uv drives CPython 3.7.17 when the interpreter is handed to it
# explicitly:
#
#   $ uv lock --python .venv/bin/python
#   $ uv sync --python .venv/bin/python
#
# What uv cannot do on this family is PROVIDE the interpreter:
#
#   $ uv python install 3.7
#   error: No download found for request: cpython-3.7-linux-x86_64-gnu
#
# python-build-standalone, the source uv manages interpreters from, has a
# floor of 3.8. So python-preference is "only-system" (never a managed
# download) and the interpreter comes from the actions/python-versions
# manifest -- see .github/workflows/ci.yml.
#
# TOML SCOPING: python-preference and python-downloads are TOP-LEVEL
# uv settings and must appear BEFORE the [pip] table. Placed after
# it they parse as pip settings and uv rejects the file outright
# with `unknown field `python-preference``.
python-preference = "only-system"
python-downloads = "manual"

[pip]
index-url = "https://pypi.org/simple"

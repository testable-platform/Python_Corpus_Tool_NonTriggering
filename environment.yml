# conda environment for branch PY-039.
#
# No solved lock exists for this interpreter: conda-forge's newest 3.7 build is 3.7.12 and no channel reachable from the build host carries python=3.7.17.
# The Anaconda defaults channel is not listed: nothing here needs it.
name: orderlab-py-039
channels:
  - conda-forge
dependencies:
  - python==3.7.17
  - pip==24.0
  - pip:
      - -r requirements-runtime.txt
      - -r requirements-dev.txt

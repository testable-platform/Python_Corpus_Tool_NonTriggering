# conda environment for branch PY-016.
#
# conda-lock.txt is the solved form of this file (linux-64, conda-forge only), generated with
# micromamba and re-created from the file to verify it:
#
#   conda create --name orderlab-py-016 --file conda-lock.txt
#
# Regenerate it after editing this file:
#
#   conda env create -f environment.yml
#   conda list --explicit --md5 > conda-lock.txt
#
# The lock covers conda packages only; the pip-installed tools are pinned by requirements-*.txt.
# The Anaconda defaults channel is not listed: nothing here needs it.
name: orderlab-py-016
channels:
  - conda-forge
dependencies:
  - python==3.6.15
  - pip==21.3.1
  - pip:
      - -r requirements-runtime.txt
      - -r requirements-dev.txt

# orderlab -- branch PY-033
# Build backend : uv_build 0.12.9
# Package manager: pip 24.0
# Interpreter    : CPython 3.7.17
#
# uv_build 0.12.9 -- MANDATES PEP 621 [project]. The uv_build package declares Requires-Python >=3.8, so pip's isolated build environment refuses it on CPython 3.7.17 ("No matching distribution found for uv_build==0.12.9") unless Requires-Python is bypassed for that one step (PIP_IGNORE_REQUIRES_PYTHON=1). uv_build is a native binary behind a thin shim, so once installed it builds the pure-Python wheel for real. Verified under CPython 3.7.17: the wheel builds, the package imports and the test suite passes. uv_build is pinned to ==0.12.9, so pip cannot float to a later release.
# pip 24.0 is the last release admitting Python 3.7 (26.2.1 needs >=3.10).

[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

# uv_build MANDATES PEP 621, so unlike the other two backends this
# branch must carry a [project] table. The uv_build package declares
# Requires-Python >=3.8, which pip enforces inside its isolated build
# environment; with PIP_IGNORE_REQUIRES_PYTHON=1 for the build step alone, uv_build
# installs and builds the wheel for real. See dataset.json ->
# branchFunctional.
[project]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
readme = "README.md"
requires-python = "==3.7.17"
license = { text = "MIT" }
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests==2.31.0",
    "Jinja2==3.1.3",
    "urllib3==2.0.6",
    "cryptography==42.0.0",
    "paramiko==2.4.1",
    "six==1.17.0"
]

[project.scripts]
orderlab = "orderlab.__main__:main"

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "crosshair-tool==0.0.110 ; python_version >= '3.8'",
    "coverage==7.16.0 ; python_version >= '3.10'",
    "pymcdc==0.2.6 ; python_version >= '3.10'",
    "radon==6.0.1",
    "lizard==1.24.0",
    "pytest-testmon==2.2.0 ; python_version >= '3.10'",
    "pylint==4.0.8 ; python_version >= '3.10'",
    "semgrep==1.176.0 ; python_version >= '3.10'",
    "bandit==1.9.4 ; python_version >= '3.10'",
    "pip-audit==2.10.1 ; python_version >= '3.10'",
    "cosmic-ray==8.7.0 ; python_version >= '3.9'",
    "beniget==0.5.0 ; python_version >= '3.6'",
    "gast==0.7.0 ; python_version >= '3.6'",
    "pydriller==2.10 ; python_version >= '3.5'",
    "ruff==0.16.5 ; python_version >= '3.7'",
    "complexipy==7.0.1 ; python_version >= '3.8'",
    "slipcover==1.1.0 ; python_version >= '3.9'",
    "mutmut==3.7.0 ; python_version >= '3.10'",
    "diff-cover==10.5.1 ; python_version >= '3.10'",
    "astroid==4.3.1 ; python_version >= '3.10'",
    "pyan3==2.8.1 ; python_version >= '3.10'",
    "vulture==2.16 ; python_version >= '3.9'",
    "dulwich==1.2.14 ; python_version >= '3.10'",
]

[tool.uv.build-backend]
module-name = "orderlab"
module-root = "src"

# orderlab -- branch PY-006
# Build backend : setuptools 59.6.0
# Package manager: uv 0.12.9
# Interpreter    : CPython 3.6.15
#
# setuptools 59.6.0 -- last release admitting Python 3.6. Predates setuptools 61, so PEP 621 [project] is unsupported and all metadata lives in setup.cfg. uv needs a PEP 621 [project] table to read the project and setuptools 59.6.0 ignores one, so pyproject.toml also carries a mirrored [project] table; setup.cfg stays authoritative for the build and full_check.py (Tool Triggering repository) asserts the two agree. setuptools 59.6.0 predates PEP 660, so uv installs the project non-editable (`--no-editable`).
# uv 0.12.9 drives CPython 3.6.15 when the interpreter is handed to it explicitly (`uv lock --python <path>`, `uv sync --python <path>`). What uv cannot do on this family is PROVIDE the interpreter: python-build-standalone's floor is 3.8, so `uv python install 3.6` fails with "No download found" and python-preference is `only-system`. Verified by execution under CPython 3.6.15: `uv lock` resolves, `uv sync` installs, the test suite passes.

[build-system]
requires = ["setuptools==59.6.0", "wheel==0.37.1"]
build-backend = "setuptools.build_meta"

# --- uv's view of the project -------------------------------------------
# uv reads PEP 621 [project] and [dependency-groups]; it does not read
# setup.cfg. This table mirrors that metadata one-to-one so that
# `uv lock` and `uv sync` can see the project. setup.cfg stays the authority
# for the build, and full_check.py (Tool Triggering repository) asserts that the two agree on name,
# version, requires-python and runtime pins.
# (setuptools 59.6.0 predates setuptools 61 and ignores [project] in silence;
# setup.cfg is where the build metadata really lives on a Python 3.6 target.)
[project]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
readme = "README.md"
requires-python = "==3.6.15"
license = { text = "MIT" }
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests==2.20.0",
    "Jinja2==2.10",
    "urllib3==1.24.1",
    "cryptography==2.3",
    "paramiko==2.4.1"
]

[project.scripts]
orderlab = "orderlab.__main__:main"

[dependency-groups]
dev = [
    "pytest==7.0.1",
    "crosshair-tool==0.0.110 ; python_version >= '3.8'",
    "coverage==7.16.0 ; python_version >= '3.10'",
    "pymcdc==0.2.6 ; python_version >= '3.10'",
    "radon==6.0.1",
    "lizard==1.24.0",
    "pytest-testmon==2.2.0 ; python_version >= '3.10'",
    "pylint==4.0.8 ; python_version >= '3.10'",
    "semgrep==1.176.0 ; python_version >= '3.10'",
    "bandit==1.9.4 ; python_version >= '3.10'",
    "pip-audit==2.10.1 ; python_version >= '3.10'",
    "cosmic-ray==8.7.0 ; python_version >= '3.9'",
    "beniget==0.5.0 ; python_version >= '3.6'",
    "gast==0.7.0 ; python_version >= '3.6'",
    "pydriller==2.10 ; python_version >= '3.5'",
    "ruff==0.16.5 ; python_version >= '3.7'",
    "complexipy==7.0.1 ; python_version >= '3.8'",
    "slipcover==1.1.0 ; python_version >= '3.9'",
    "mutmut==3.7.0 ; python_version >= '3.10'",
    "diff-cover==10.5.1 ; python_version >= '3.10'",
    "astroid==4.3.1 ; python_version >= '3.10'",
    "pyan3==2.8.1 ; python_version >= '3.10'",
    "vulture==2.16 ; python_version >= '3.9'",
    "dulwich==1.2.14 ; python_version >= '3.10'",
]
